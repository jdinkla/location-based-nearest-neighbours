# Logging config for local `just run` / `sbt run` only.
# Wired in via build.sbt (run / javaOptions -Dlog4j2.configurationFile=...).
# It is intentionally NOT under src/main/resources, so it is never bundled into
# the spark-submit assembly jar — cluster logging is left to the cluster.
#
# Why this exists: by default Spark/log4j2 write all output (incl. INFO) to
# STDERR, and sbt's forked-run logger tags every stderr line "[error]" — so a
# healthy run looks like a wall of errors. This config:
#   1. writes to STDOUT, so sbt tags the lines "[info]" instead, and
#   2. quiets Spark/Hadoop to WARN, leaving the app's own ### lines visible.

status = error
name = LbnnLocalConfig

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %-5p %c{1}: %m%n

# Quiet by default; only warnings and errors from the framework get through.
rootLogger.level = WARN
rootLogger.appenderRef.console.ref = console

# The app's own logger stays at INFO so the ### progress messages show.
logger.lbnn.name = net.dinkla.lbnn
logger.lbnn.level = INFO

# Silence the harmless "Unable to load native-hadoop library" warning.
logger.nativecode.name = org.apache.hadoop.util.NativeCodeLoader
logger.nativecode.level = ERROR
